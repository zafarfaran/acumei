# Runs on pull requests only (not on direct pushes to default branch).
name: Pull request checks

on:
  pull_request:
    branches: ['**']

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

  # Optional: set repo variable ENABLE_VERCEL_ACTION=true and add Action secrets
  # VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (GitHub → Settings → Secrets and variables).
  # If you use Vercel’s GitHub integration only, leave the variable unset and skip this job.
  vercel-preview:
    name: Vercel preview
    runs-on: ubuntu-latest
    needs: verify
    if: >
      vars.ENABLE_VERCEL_ACTION == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
